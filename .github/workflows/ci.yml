name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Formatação
        run: npm run format:check
      - name: Lint, história, sabotagem e segurança
        run: npm test
      - name: Auditoria de dependências
        run: npm audit --audit-level=moderate
      - name: Stress
        run: node tests/stress.mjs 100
